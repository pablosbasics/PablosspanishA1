<body>
<header>
  <h1>Español A1 / A2 – Mein Lernplan</h1>
  <p>Grammatik verstehen, Wortschatz wiederholen, jeden Tag ein Stück weiter.</p>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* =====================================================================
   HILFSFUNKTIONEN: Täglich freischalten, Verben bilden, Übungen erzeugen
   ===================================================================== */
const START_KEY = 'espanol-a1-start';
const KEY = 'espanol-a1-progress-v2';

function dayOffset(){
  let s = localStorage.getItem(START_KEY);
  if(!s){ s = String(Date.now()); try{ localStorage.setItem(START_KEY, s); }catch(e){} }
  return Math.max(0, Math.floor((Date.now() - Number(s)) / 86400000));
}
/* Jeden Tag werden neue Einträge freigeschaltet: Start mit 'base', danach 'perDay' pro Tag */
function visible(pool, base = 6, perDay = 2){
  return pool.slice(0, Math.min(pool.length, base + perDay * dayOffset()));
}

let progress = JSON.parse(localStorage.getItem(KEY) || '{"done":{}}');
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }

const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^\p{L}\s]/gu,'').replace(/\s+/g,' ').trim();

function say(t){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'es-ES'; u.rate = 0.9;
  speechSynthesis.speak(u);
}

const PRON = ['yo','tú','él / ella / usted','nosotros','ellos / ustedes'];
const REG_AR = ['o','as','a','amos','an'];
const REG_ER = ['o','es','e','emos','en'];
const REG_IR = ['o','es','e','imos','en'];
const PRET_AR = ['é','aste','ó','amos','aron'];
const PRET_ER = ['í','iste','ió','imos','ieron'];

/* Regelmäßiges Präsens: Stamm + Endung */
function regPres(inf){
  const stem = inf.slice(0,-2);
  const end = inf.endsWith('ar') ? REG_AR : inf.endsWith('er') ? REG_ER : REG_IR;
  return end.map(e => stem + e);
}
/* Regelmäßiges Indefinido */
function pretReg(inf){
  const stem = inf.slice(0,-2);
  return inf.endsWith('ar')
    ? PRET_AR.map(e => stem + e)
    : PRET_ER.map(e => stem + e);
}

/* Verb-Übungen: Person und Verb zufällig, Antwort = richtige Form */
function verbEx(items){
  if(!items.length) return [];
  return Array.from({length:8}, (_,i)=>{
    const v = items[Math.floor(Math.random()*items.length)];
    const k = Math.floor(Math.random()*5);
    const q = `${PRON[k]} ___ (${v.inf} – ${v.de})`;
    if(i % 2 === 0){
      const opts = [...new Set(v.f)].sort(()=>Math.random()-0.5);
      return {t:'mc', q, o:opts, a:opts.indexOf(v.f[k]), h:`Richtig: „${v.f[k]}“`};
    }
    return {t:'fill', q, a:v.f[k], h:`Richtig: „${v.f[k]}“`};
  });
}

/* Vokabel-Übungen: Bedeutung erkennen und Übersetzung eingeben */
function vocabEx(vocab){
  const picked = [...vocab].sort(()=>Math.random()-0.5).slice(0, 8);
  return picked.map((v,i)=>{
    if(i % 2 === 0){
      const others = vocab.map(x=>x[1]).filter(x=>x!==v[1]).sort(()=>Math.random()-0.5).slice(0,3);
      const o = [v[1], ...others].sort(()=>Math.random()-0.5);
      return {t:'mc', q:`Was bedeutet „${v[0]}“?`, o, a:o.indexOf(v[1]), h:`„${v[0]}“ heißt „${v[1]}“.`};
    }
    return {t:'fill', q:`Wie sagt man „${v[1]}“ auf Spanisch?`, a:v[0], h:`„${v[1]}“ heißt auf Spanisch „${v[0]}“.`};
  });
}

/* Liefert die Übungen einer Lektion (bei Vokabel- und Verb-Lektionen dynamisch) */
function getEx(L){
  if(L.type === 'vocab') return vocabEx(visible(L.pool));
  if(L.type === 'verb') return verbEx(visible(L.pool, 4));
  return L.ex || [];
}

/* =====================================================================
   GRAMMATIK A1
   ===================================================================== */
const A1_GRAMMAR = [
{
  id:'l0', title:'0. Artikel erkennen: bestimmt & unbestimmt', goal:'Der, die, das bzw. el, la, los, las – und ein, eine bzw. un, una, unos, unas',
  rule:`
  <h3>Warum Artikel so wichtig sind</h3>
  <p>Im Deutschen sagst du "der Tisch", "die Lampe", "das Buch". Im Spanischen gibt es nur <b>zwei</b> Geschlechter: maskulin und feminin. Jedes Nomen hat also ein festes Geschlecht, und der Artikel verrät es dir. Wenn du den Artikel immer mitlernst, sprichst du von Anfang an richtig.</p>

  <h3>Bestimmter Artikel: el, la, los, las</h3>
  <p>Er steht für etwas Bekanntes oder Bestimmtes: <i>„die Mesa (die Tisch in diesem Raum)“</i>.</p>
  <table>
    <tr><th></th><th>Singular</th><th>Plural</th></tr>
    <tr><td>maskulin</td><td>el libro (das Buch)</td><td>los libros (die Bücher)</td></tr>
    <tr><td>feminin</td><td>la casa (das Haus)</td><td>las casas (die Häuser)</td></tr>
  </table>

  <h3>Unbestimmter Artikel: un, una, unos, unas</h3>
  <p>Er steht für etwas Neues oder Nicht-Bestimmtes: <i>„ein Buch“, „eine Tasche“</i>.</p>
  <table>
    <tr><th></th><th>Singular</th><th>Plural</th></tr>
    <tr><td>maskulin</td><td>un libro (ein Buch)</td><td>unos libros (einige Bücher)</td></tr>
    <tr><td>feminin</td><td>una casa (ein Haus)</td><td>unas casas (einige Häuser)</td></tr>
  </table>

  <div class="step"><b>Faustregel für bestimmt oder unbestimmt:</b><br>
  Kennt ihr das Ding schon (Gesprächsthema, Kontext)? → <b>el / la</b>. Ist es neu, irgendeins von vielen? → <b>un / una</b>.<br>
  Beispiel: „Ich habe <i>ein</i> Auto.“ = <b>Tengo un coche.</b> – „<i>Das</i> Auto ist rot.“ = <b>El coche es rojo.</b></div>

  <h3>Das Geschlecht erkennen</h3>
  <p><b>Maskulin</b> sind meist:</p>
  <ul>
    <li>Wörter auf <b>-o</b>: el libro, el tiempo, el dinero</li>
    <li>Wörter auf <b>-or</b>, <b>-aje</b>, <b>-ma</b>: el amor, el viaje, el problema, el idioma</li>
  </ul>
  <p><b>Feminin</b> sind meist:</p>
  <ul>
    <li>Wörter auf <b>-a</b>: la casa, la mesa, la mañana</li>
    <li>Wörter auf <b>-ción</b>, <b>-sión</b>, <b>-dad</b>, <b>-tad</b>, <b>-umbre</b>: la canción, la televisión, la ciudad, la verdad</li>
  </ul>
  <div class="warn"><b>Achtung:</b> Es gibt Ausnahmen. <i>el problema</i> und <i>el idioma</i> enden auf -a, sind aber maskulin. Wörter auf -e oder Konsonant musst du mit dem Artikel lernen: <i>la calle, la noche, el hotel, el móvil</i>. Lerne also immer „el hotel“, nicht nur „hotel“.</div>

  <h3>Betonte Anfangs-a</h3>
  <p>Beginnt ein feminines Wort mit betontem a- oder ha-, steht im Singular <b>el</b> statt <b>la</b>: <i>el agua (das Wasser)</i>, <i>el águila (der Adler)</i>. Im Plural bleibt es <b>las</b>: <i>las aguas</i>. Der Artikel ändert sich nur für die Aussprache, das Wort bleibt feminin. Deshalb sagt man auch <i>un agua</i> und <i>una agua</i> ist nicht üblich.</p>

  <h3>Plural bilden</h3>
  <ul>
    <li>Endet das Wort auf <b>Vokal</b>: <b>+s</b> → el libro → los libros</li>
    <li>Endet es auf <b>Konsonant</b>: <b>+es</b> → el lápiz → los lápices, la ciudad → las ciudades</li>
  </ul>

  <h3>Verschmelzungen</h3>
  <p>Mit <i>a</i> und <i>de</i> verschmelzen die Formen mit <i>el</i> (nicht mit <i>la</i>, <i>los</i>, <i>las</i>):</p>
  <table>
    <tr><td>a + el = <b>al</b></td><td>Voy al cine. (Ich gehe ins Kino.)</td></tr>
    <tr><td>de + el = <b>del</b></td><td>Es el libro del profesor. (Es ist das Buch des Lehrers.)</td></tr>
    <tr><td>a + la / de la</td><td>Voy a la playa. / Es la casa de la familia. (keine Verschmelzung)</td></tr>
  </table>

  <h3>Ohne Artikel</h3>
  <p>Im Spanischen fällt der Artikel öfter weg als im Deutschen:</p>
  <ul>
    <li>Sprachen: <i>Hablo español.</i> (Ich spreche Spanisch.)</li>
    <li>Berufe nach <i>ser</i>: <i>Soy profesor.</i> (Ich bin Lehrer.)</li>
    <li>Nach <i>tener</i> bei unbestimmten Mengen: <i>Tengo hermanos.</i> (Ich habe Geschwister.)</li>
  </ul>
  <p class="rule"><b>Merke:</b> Bei <i>gustar</i> und <i>encantar</i> steht dagegen fast immer der bestimmte Artikel: <i>Me gusta el café.</i> (Ich mag Kaffee.)</p>`,
  examples:['La mesa es grande.','Tengo un coche rojo.','Me gustan las manzanas.','Voy al cine con el profesor.'],
  ex:[
    {t:'mc', q:'___ mesa es grande. (Der Tisch … )', o:['El','La','Los','Las'], a:1, h:'„mesa“ ist feminin, also „la mesa“.'},
    {t:'mc', q:'Quiero ___ café, por favor. (Ich möchte einen Kaffee)', o:['un','una','el','los'], a:0, h:'„café“ ist maskulin, unbestimmt: „un café“.'},
    {t:'mc', q:'___ problema es difícil. (Das Problem … )', o:['El','La','Los','Una'], a:0, h:'Trotz der Endung -a ist „problema“ maskulin.'},
    {t:'fill', q:'Plural von „el día“ mit Artikel: ___ días (die Tage)', a:'los', h:'Der Artikel im Plural maskulin ist „los“.'},
    {t:'mc', q:'Wie verschmilzt „a + el“?', o:['al','del','ael','a el'], a:0},
    {t:'mc', q:'Wie verschmilzt „de + el“?', o:['del','al','de el','dela'], a:0},
    {t:'mc', q:'Soy ___ profesor. (Ich bin Lehrer)', o:['(kein Artikel)','un','el','una'], a:0, h:'Berufe nach „ser“ stehen ohne Artikel.'},
    {t:'fill', q:'Me gusta ___ (die Musik). Schreibe mit Artikel.', a:'la música', h:'Bei „gustar“ steht der bestimmte Artikel.'}
  ]
},
{
  id:'l1', title:'1. ser – Wer bin ich?', goal:'Identität, Herkunft, Beruf, Eigenschaften beschreiben',
  rule:`
  <h3>Konjugation von ser</h3>
  <table>
    <tr><th>Person</th><th>ser</th><th>Beispiel</th></tr>
    <tr><td>yo</td><td>soy</td><td>Soy de Alemania. (Ich bin aus Deutschland.)</td></tr>
    <tr><td>tú</td><td>eres</td><td>Eres muy simpático. (Du bist sehr sympathisch.)</td></tr>
    <tr><td>él / ella / usted</td><td>es</td><td>Ella es profesora. (Sie ist Lehrerin.)</td></tr>
    <tr><td>nosotros</td><td>somos</td><td>Somos amigos. (Wir sind Freunde.)</td></tr>
    <tr><td>ellos / ustedes</td><td>son</td><td>Son estudiantes. (Sie sind Studenten.)</td></tr>
  </table>

  <h3>Wann benutzt man ser?</h3>
  <p><i>Ser</i> beschreibt, was etwas <b>von Natur aus</b> ist. Dazu gehören:</p>
  <ul>
    <li><b>Identität und Name:</b> Soy Lucas. (Ich bin Lucas.)</li>
    <li><b>Herkunft:</b> Somos de Hannover. (Wir sind aus Hannover.)</li>
    <li><b>Beruf:</b> Soy estudiante. (Ich bin Student.)</li>
    <li><b>Dauerhafte Eigenschaften:</b> Mi hermana es alta. (Meine Schwester ist groß.)</li>
    <li><b>Uhrzeit und Datum:</b> Son las tres. (Es ist drei Uhr.) Hoy es lunes. (Heute ist Montag.)</li>
    <li><b>Material und Besitz:</b> La mesa es de madera. (Der Tisch ist aus Holz.) Es mi libro. (Es ist mein Buch.)</li>
  </ul>

  <div class="step"><b>Merkhilfe:</b> Frage dich: „Ist das eine Eigenschaft, die bleibt?“ Dann <i>ser</i>. Bei Zustand und Ort gilt <i>estar</i> (siehe nächste Lektion).</div>

  <h3>Satzbau</h3>
  <p>Im Spanischen darfst du das Subjekt weglassen, weil die Verbform schon zeigt, wer gemeint ist: <i>Soy alemán.</i> statt <i>Yo soy alemán.</i> Das „yo“ benutzt man nur zur Betonung: <i>Yo soy alemán, ¿y tú?</i> (Ich bin Deutscher, und du?)</p>
  <p class="rule"><b>Achtung:</b> Die Adjektive stimmen mit dem Nomen überein: <i>Es alto.</i> (Er ist groß.) <i>Es alta.</i> (Sie ist groß.)</p>`,
  examples:['Soy de Alemania.','Ella es profesora.','Somos amigos.','Hoy es lunes.'],
  ex:[
    {t:'mc', q:'Yo ___ alemán.', o:['soy','eres','es','son'], a:0},
    {t:'fill', q:'Nosotros ___ amigos. (ser)', a:'somos'},
    {t:'mc', q:'Ellos ___ estudiantes.', o:['somos','son','sois','eres'], a:1},
    {t:'mc', q:'Son ___ tres. (Es ist drei Uhr)', o:['las','los','el','la'], a:0, h:'Bei der Uhrzeit: „son las“ (Plural), außer bei „es la una“.'}
  ]
},
{
  id:'l2', title:'2. estar & ser oder estar?', goal:'Zustände und Orte von dauerhaften Eigenschaften unterscheiden',
  rule:`
  <h3>Konjugation von estar</h3>
  <table>
    <tr><th>Person</th><th>estar</th><th>Beispiel</th></tr>
    <tr><td>yo</td><td>estoy</td><td>Estoy en casa. (Ich bin zu Hause.)</td></tr>
    <tr><td>tú</td><td>estás</td><td>¿Cómo estás? (Wie geht es dir?)</td></tr>
    <tr><td>él / ella / usted</td><td>está</td><td>Madrid está en España.</td></tr>
    <tr><td>nosotros</td><td>estamos</td><td>Estamos cansados. (Wir sind müde.)</td></tr>
    <tr><td>ellos / ustedes</td><td>están</td><td>Están en la cocina. (Sie sind in der Küche.)</td></tr>
  </table>

  <h3>Die zwei Grundfragen</h3>
  <p><b>Wo bin ich?</b> → <i>estar</i> (Ort und Lage). <b>Wie bin ich gerade?</b> → <i>estar</i> (Zustand, Stimmung, Gesundheit).</p>
  <p><b>Was bin ich?</b> → <i>ser</i> (dauerhaft, Identität).</p>

  <h3>Das gleiche Adjektiv, zwei Bedeutungen</h3>
  <table>
    <tr><th>Mit ser</th><th>Mit estar</th></tr>
    <tr><td>Él es aburrido. (Er ist langweilig – sein Charakter)</td><td>Él está aburrido. (Er ist gelangweilt – gerade so)</td></tr>
    <tr><td>Ella es lista. (Sie ist klug.)</td><td>Ella está lista. (Sie ist fertig/bereit.)</td></tr>
    <tr><td>Soy nervioso. (Ich bin ein nervöser Typ.)</td><td>Estoy nervioso. (Ich bin gerade nervös.)</td></tr>
  </table>

  <div class="step"><b>Merke:</b> Mit <i>estar</i> sagst du, wie etwas <b>im Moment</b> ist. Mit <i>ser</i> sagst du, wie etwas <b>grundsätzlich</b> ist.</div>

  <h3>Typische Redewendungen mit estar</h3>
  <ul>
    <li><i>¿Cómo estás?</i> (Wie geht es dir?) – <i>Estoy bien.</i> (Mir geht es gut.)</li>
    <li><i>¿Dónde estás?</i> (Wo bist du?) – <i>Estoy en la oficina.</i> (Ich bin im Büro.)</li>
    <li><i>Estar de vacaciones</i> (im Urlaub sein), <i>estar en casa</i> (zu Hause sein)</li>
  </ul>`,
  examples:['Estoy en casa.','¿Cómo estás?','Madrid está en España.','Él es aburrido. / Él está aburrido.'],
  ex:[
    {t:'mc', q:'¿Cómo ___ tú? (Wie geht es dir?)', o:['estás','eres','estoy','son'], a:0},
    {t:'fill', q:'Madrid ___ en España. (Lage)', a:'está'},
    {t:'mc', q:'Yo ___ cansado (heute, gerade).', o:['soy','estoy','es','son'], a:1},
    {t:'mc', q:'Mi hermano ___ alto. (Eigenschaft)', o:['está','es','estás','están'], a:1},
    {t:'mc', q:'Ella ___ lista. (fertig, bereit)', o:['es','está','son','estoy'], a:1, h:'Fertig/bereit sein ist ein Zustand: estar.'}
  ]
},
{
  id:'l3', title:'3. Nomen: Genus & Plural vertiefen', goal:'Das Geschlecht von Nomen sicher bestimmen',
  rule:`
  <p>Lektion 0 hat dir die Artikel erklärt. Hier übst du das Geschlecht der Nomen. Im Spanischen ist das Geschlecht bei fast allen Nomen festgelegt. Die Adjektive richten sich danach.</p>
  <table>
    <tr><th>Endung</th><th>meist</th><th>Beispiele</th></tr>
    <tr><td>-o</td><td>maskulin</td><td>el libro, el coche, el tiempo</td></tr>
    <tr><td>-a</td><td>feminin</td><td>la mesa, la mujer, la semana</td></tr>
    <tr><td>-ción / -dad</td><td>feminin</td><td>la nación, la ciudad</td></tr>
    <tr><td>-e / Konsonant</td><td>unterschiedlich</td><td>el café, la calle, el hotel</td></tr>
  </table>
  <h3>Personen mit Geschlecht</h3>
  <p>Bei Personen folgt das Geschlecht der Person: <i>el amigo</i> (der Freund) / <i>la amiga</i> (die Freundin). Berufe auf -e und -ista bleiben gleich, nur der Artikel ändert sich: <i>el / la estudiante</i>, <i>el / la turista</i>.</p>
  <div class="warn"><b>Wichtig:</b> Wörter auf -e und -ista sind nicht festgelegt. Lerne sie immer mit Artikel.</div>`,
  examples:['La amiga de mi hermana.','El turista habla inglés.'],
  ex:[
    {t:'mc', q:'Welches Wort ist feminin?', o:['el problema','la mano','el día','el mapa'], a:1, h:'„la mano“ (die Hand) ist feminin. Sie endet auf -o, ist aber eine der bekannten Ausnahmen. Solche Wörter lernst du am besten mit Artikel.'},
    {t:'mc', q:'Der Plural von „la ciudad“ ist:', o:['las ciudades','las ciudads','los ciudades','las ciudadas'], a:0},
    {t:'fill', q:'Wie sagt man „die Freundin“ auf Spanisch?', a:'la amiga'},
    {t:'mc', q:'„El turista“ und „la turista“ bedeuten:', o:['der / die Tourist/in','der Tourismus','das Hotel','die Reise'], a:0}
  ]
},
{
  id:'l4', title:'4. Präsens – regelmäßige Verben', goal:'Verben auf -ar, -er, -ir bilden',
  rule:`
  <h3>Die drei Verbgruppen</h3>
  <p>Jedes regelmäßige Verb hat im Infinitiv eine Endung: <b>-ar</b>, <b>-er</b> oder <b>-ir</b>. Diese Endung wird abgeschnitten, und der <b>Stamm</b> bleibt. Dann kommt die neue Endung dazu.</p>
  <table>
    <tr><th>Person</th><th>hablar (-ar)<br>sprechen</th><th>comer (-er)<br>essen</th><th>vivir (-ir)<br>wohnen</th></tr>
    <tr><td>yo</td><td>hablo</td><td>como</td><td>vivo</td></tr>
    <tr><td>tú</td><td>hablas</td><td>comes</td><td>vives</td></tr>
    <tr><td>él / ella / usted</td><td>habla</td><td>come</td><td>vive</td></tr>
    <tr><td>nosotros</td><td>hablamos</td><td>comemos</td><td>vivimos</td></tr>
    <tr><td>ellos / ustedes</td><td>hablan</td><td>comen</td><td>viven</td></tr>
  </table>
  <div class="step"><b>Vorgehen in drei Schritten:</b><br>
  1. Infinitiv nehmen: <i>hablar</i><br>
  2. Stamm bestimmen: <i>habl-</i> (Infinitiv ohne -ar)<br>
  3. Endung passend zur Person anhängen: <i>yo habl + o = hablo</i></div>

  <h3>Die Besonderheit bei der Person „tú“</h3>
  <p>Die Form für <i>tú</i> endet immer auf <b>-s</b>: hablas, comes, vives. Du erkennst das „du“ also am -s.</p>

  <h3>Wichtig: Das Subjekt ist oft unnötig</h3>
  <p>Die Verbendung zeigt die Person. <i>Hablo español.</i> reicht völlig, <i>Yo hablo español</i> wirkt betonter (Ich spreche Spanisch, nicht du).</p>

  <h3>Verneinung</h3>
  <p>Das <i>no</i> steht direkt vor dem Verb: <i>No hablo francés.</i> (Ich spreche kein Französisch.) <i>No vivo aquí.</i> (Ich wohne nicht hier.)</p>`,
  examples:['Yo hablo español.','¿Tú comes carne?','Ellos viven en Berlín.','No trabajo los domingos.'],
  ex:[
    {t:'fill', q:'Yo ___ (hablar)', a:'hablo'},
    {t:'mc', q:'Tú ___ (comer)', o:['como','comes','come','comen'], a:1},
    {t:'fill', q:'Nosotros ___ (vivir)', a:'vivimos'},
    {t:'mc', q:'Ella ___ (trabajar)', o:['trabaja','trabajas','trabajan','trabajo'], a:0},
    {t:'mc', q:'Wie verneint man „Ich arbeite“?', o:['No trabajo.','Trabajo no.','No trabaja.','Yo no trabajo no.'], a:0}
  ]
},

  id:'l5', title:'5. Wichtige unregelmäßige Verben (Präsens)', goal:'tener, ir, hacer, poder, querer und andere häufige Verben',
  rule:`
  <p>Unregelmäßige Verben ändern im Präsens den Stamm oder haben eigene Formen. Die wichtigsten musst du auswendig können, weil du sie ständig brauchst.</p>
  <table>
    <tr><th>Person</th><th>tener<br>haben</th><th>ir<br>gehen</th><th>hacer<br>machen</th><th>poder<br>können</th></tr>
    <tr><td>yo</td><td>tengo</td><td>voy</td><td>hago</td><td>puedo</td></tr>
    <tr><td>tú</td><td>tienes</td><td>vas</td><td>haces</td><td>puedes</td></tr>
    <tr><td>él / ella / usted</td><td>tiene</td><td>va</td><td>hace</td><td>puede</td></tr>
    <tr><td>nosotros</td><td>tenemos</td><td>vamos</td><td>hacemos</td><td>podemos</td></tr>
    <tr><td>ellos / ustedes</td><td>tienen</td><td>van</td><td>hacen</td><td>pueden</td></tr>
  </table>
  <h3>Drei Arten von Unregelmäßigkeit</h3>
  <ul>
    <li><b>Stammvokal ändert sich</b> (e → ie, o → ue, e → i): <i>tener → tienes</i>, <i>poder → puedes</i>. Die Änderung passiert in allen Formen außer <i>nosotros</i> und <i>vosotros</i>.</li>
    <li><b>Yo-Form ist anders:</b> <i>hacer → hago</i>, <i>venir → vengo</i>, <i>decir → digo</i>, <i>saber → sé</i>.</li>
    <li><b>Komplett eigene Formen:</b> <i>ir → voy / vas / va</i>, <i>ser / estar</i> (siehe oben).</li>
  </ul>
  <div class="step"><b>Tipp:</b> Lerne unregelmäßige Verben immer in Sätzen: <i>Tengo tres hermanos.</i> <i>Voy al parque.</i> <i>¿Qué haces hoy?</i> <i>¿Puedes venir?</i></div>
  <p><b>Weitere wichtige Verben:</b> venir (kommen), decir (sagen), saber (wissen / können), ver (sehen), dar (geben), pensar (denken), entender (verstehen), empezar (anfangen). Sie stehen im Verbtraining.</p>`,

    {t:'mc', q:'Nosotros ___ (querer) ir. (Stammvokal ändert sich)', o:['queremos','quiero','quieres','quieren'], a:0}
  ]
},

  rule:`

  <p>0 cero · 1 uno · 2 dos · 3 tres · 4 cuatro · 5 cinco · 6 seis · 7 siete · 8 ocho · 9 nueve · 10 diez · 11 once · 12 doce · 13 trece · 14 catorce · 15 quince · 16 dieciséis · 17 diecisiete · 18 dieciocho · 19 diecinueve · 20 veinte</p>
  <p>Ab 21 schreibt man zusammen oder mit y: <i>veintiuno / veinte y uno</i>. Vorsicht: <i>uno</i> wird vor Nomen zu <i>un</i>: <i>un libro</i>, aber <i>veintiún libros</i>.</p>

  <h3>hay (es gibt)</h3>
  <p><i>Hay</i> bedeutet „es gibt“ und ist für Singular und Plural gleich: <i>Hay un libro. / Hay dos libros.</i> Es wird nie konjugiert. Die Frage lautet <i>¿Hay …?</i> (Gibt es …?). Vergiss das Subjekt nicht im Deutschen: „Es gibt zwei Bücher“ heißt hier wörtlich „Hay dos libros“.</p>

    <li>Mit <i>ya</i> (schon) und <i>todavía no</i> (noch nicht): <i>Ya he comido. / Todavía no he comido.</i></li>
    <li>Mit <i>nunca</i> (nie) und <i>alguna vez</i> (jemals): <i>Nunca he viajado en avión.</i> (Ich bin noch nie geflogen.)</li>

  <div class="warn"><b>Achtung:</b> Das Partizip bleibt immer gleich. „haber“ ist das Hilfsverb. Anders als im Deutschen steht das Pronomen vor <i>haber</i>: <i>Lo he visto.</i> (Ich habe es gesehen.)</div>
  <p class="rule"><b>Unterschied zum Indefinido:</b> Das Perfecto betont, dass etwas Teil der Gegenwart ist oder Auswirkungen hat. Das Indefinido erzählt ein abgeschlossenes Ereignis: <i>Ayer comí paella.</i> (Gestern habe ich Paella gegessen.)</p>`,

  <h3>Die Endungen</h3>

  <div class="step"><b>Erkennen:</b> Die Endung -ar ist -é / -aste / -ó / -amos / -aron. Die Endungen -er und -ir sind gleich: -í / -iste / -ió / -imos / -ieron. Achte auf den Akzent bei yo (é, í) und bei él/ella (ó, ió).</div>

{

  <h3>Die unregelmäßigen Formen</h3>

  <h3>Wichtige Hinweise</h3>
  <ul>
    <li><b>ir und ser</b> haben im Indefinido dieselbe Form. Der Satz zeigt, was gemeint ist: <i>Fui al cine.</i> (Ich bin ins Kino gegangen.) <i>Fue un día largo.</i> (Es war ein langer Tag.)</li>

    <li>Typische Verben mit <b>eigenem Stamm</b>: poder (pude), decir (dije), ver (vi), venir (vine), dar (di), saber (supe), querer (quise).</li>

  <div class="step"><b>Tipp:</b> Lerne die Formen in Gruppen: „hice, hiciste, hizo“ zusammen. So verwechselst du sie nicht mehr.</div>`,

{
  id:'a2-4', title:'A2 · 13. Imperfecto & Indefinido', goal:'Hintergründe beschreiben und Ereignisse erzählen',
  rule:`
  <h3>Die Endungen des Imperfecto</h3>
  <table>
    <tr><th>Person</th><th>hablar</th><th>comer</th><th>vivir</th><th>ser</th><th>ir</th></tr>
    <tr><td>yo</td><td>hablaba</td><td>comía</td><td>vivía</td><td>era</td><td>iba</td></tr>
    <tr><td>tú</td><td>hablabas</td><td>comías</td><td>vivías</td><td>eras</td><td>ibas</td></tr>
    <tr><td>él / ella</td><td>hablaba</td><td>comía</td><td>vivía</td><td>era</td><td>iba</td></tr>
    <tr><td>nosotros</td><td>hablábamos</td><td>comíamos</td><td>vivíamos</td><td>éramos</td><td>íbamos</td></tr>
    <tr><td>ellos</td><td>hablaban</td><td>comían</td><td>vivían</td><td>eran</td><td>iban</td></tr>
  </table>
  <p>Es gibt nur drei unregelmäßige Verben im Imperfecto: <i>ser</i> (era), <i>ir</i> (iba) und <i>ver</i> (veía). Alles andere ist regelmäßig.</p>

  <h3>Wann Imperfecto, wann Indefinido?</h3>
  <table>
    <tr><th>Imperfecto (Hintergrund)</th><th>Indefinido (Handlung)</th></tr>
    <tr><td>Beschreibungen: <i>Hacía frío.</i> (Es war kalt.)</td><td>Einzelnes Ereignis: <i>Llegó mi amigo.</i> (Mein Freund kam an.)</td></tr>
    <tr><td>Gewohnheiten: <i>Cuando era niño, jugaba al fútbol.</i></td><td>Abgeschlossene Handlung: <i>Ayer jugué al fútbol.</i></td></tr>
    <tr><td>Gleichzeitige Handlungen: <i>Mientras cocinaba, leía.</i></td><td>Unterbrechung: <i>Cuando llegó, cocinaba.</i></td></tr>
    <tr><td>Alter, Gefühle: <i>Tenía miedo.</i> (Ich hatte Angst.)</td><td>Ereignis: <i>Tuve un accidente.</i></td></tr>
  </table>
  <div class="step"><b>Eselsbrücke:</b> Das Imperfecto ist die „Kulisse“ (wie die Bühne eines Films). Das Indefinido ist die „Handlung“ (was auf der Bühne passiert). Oft stehen beide im selben Satz: <i>Cuando <b>era</b> niño, <b>vivía</b> en el campo.</i> (Als ich Kind war, lebte ich auf dem Land.)</div>`,
  examples:['Cuando era niño, vivía en el campo.','Hacía frío y llovía.','Ayer llegó mi amigo.','Mientras cocinaba, escuchaba música.'],
  ex:[
    {t:'mc', q:'Cuando era niño, ___ en el campo.', o:['vivía','viví','vivió','vive'], a:0},
    {t:'fill', q:'Antes ___ (tener, yo) un coche rojo.', a:'tenía'},
    {t:'mc', q:'Ayer ___ mucho frío. (Wetter beschreiben)', o:['hacía','hizo','hace','hice'], a:0, h:'Wetter in der Vergangenheit beschreibt man mit dem Imperfecto.'},
    {t:'mc', q:'Mientras yo ___, mi hermano ___.', o:['cocinaba – leía','cociné – leí','cocino – leo','cocinaba – leí'], a:0}
  ]

{

  rule:`
  <h3>Direktes und indirektes Objekt</h3>
  <p>Im Deutschen fragst du: „Wen oder was?“ (Akkusativ) oder „Wem?“ (Dativ). Im Spanischen gibt es dafür eigene Pronomen, die du vor dem Verb setzt.</p>
  <table>
    <tr><th></th><th>direktes Objekt (Wen? Was?)</th><th>indirektes Objekt (Wem?)</th></tr>
    <tr><td>mich / dich</td><td>me / te</td><td>me / te</td></tr>
    <tr><td>ihn / sie (Sache)</td><td>lo / la</td><td>le</td></tr>
    <tr><td>uns</td><td>nos</td><td>nos</td></tr>

  <h3>Beispiele</h3>
  <ul>
    <li>¿Tienes el libro? – Sí, <b>lo</b> tengo. (Hast du das Buch? – Ja, ich habe es.)</li>

  <h3>Wo steht das Pronomen?</h3>

  <div class="warn"><b>Typischer Fehler:</b> Das Pronomen „le“ wird nicht für den Akkusativ verwendet. Wenn du „ihn“ oder „sie“ meinst (direkt), nimm <i>lo</i> oder <i>la</i>. „le“ ist nur für „ihm/ihr“ (Dativ).</div>`,

{
  id:'a2-7', title:'A2 · 16. Reflexive Verben', goal:'Über den Alltag sprechen (aufstehen, sich waschen, sich anziehen)',
  rule:`
  <h3>Was sind reflexive Verben?</h3>
  <p>Bei reflexiven Verben handelt die Person an sich selbst. Im Deutschen heißt es „sich waschen“, „sich anziehen“. Im Spanischen gibt es das Pronomen <b>se</b> im Infinitiv, und die Konjugation passt das Pronomen an die Person an.</p>
  <table>
    <tr><th>Person</th><th>levantarse</th><th>ducharse</th><th>llamarse</th></tr>
    <tr><td>yo</td><td>me levanto</td><td>me ducho</td><td>me llamo</td></tr>
    <tr><td>tú</td><td>te levantas</td><td>te duchas</td><td>te llamas</td></tr>
    <tr><td>él / ella / usted</td><td>se levanta</td><td>se ducha</td><td>se llama</td></tr>
    <tr><td>nosotros</td><td>nos levantamos</td><td>nos duchamos</td><td>nos llamamos</td></tr>
    <tr><td>ellos / ustedes</td><td>se levantan</td><td>se duchan</td><td>se llaman</td></tr>
  </table>
  <div class="step"><b>Regel:</b> Das Pronomen steht vor dem konjugierten Verb: <i>Me levanto a las siete.</i> Der Infinitiv endet auf <b>-se</b>, und dieses Anhängsel fällt bei der Konjugation weg.</div>
  <h3>Häufige Verben im Alltag</h3>
  <ul>
    <li><i>levantarse</i> (aufstehen), <i>ducharse</i> (duschen), <i>vestirse</i> (sich anziehen), <i>acostarse</i> (ins Bett gehen), <i>llamarse</i> (heißen)</li>
  </ul>
  <div class="warn"><b>Achtung:</b> Nicht alle Verben mit „se“ sind reflexiv. Bei <i>Se llama Ana.</i> (Sie heißt Ana.) ist es reflexiv, weil die Person sich selbst „nennt“. Viele Verben wie <i>gustar</i> haben „se“ aus anderen Gründen. Lerne daher die reflexive Form jedes Verbs einzeln.</div>`,
  examples:['Me levanto a las siete.','¿Cómo se llama usted?','Ellos se acuestan tarde.','Nos duchamos por la mañana.'],

    {t:'mc', q:'Nosotros ___ por la mañana. (ducharse)', o:['nos duchamos','nos ducháis','se duchan','me duchamos'], a:0},
    {t:'fill', q:'Ellos ___ tarde. (acostarse)', a:'se acuestan'}
  ]
},
{

  rule:`
  <h3>Gerundio (Verlaufsform)</h3>
  <p>Die Bildung: <b>-ar → -ando</b> (hablando), <b>-er / -ir → -iendo</b> (comiendo, viviendo). Zusammen mit <i>estar</i> beschreibt es, was <b>gerade passiert</b>:</p>
  <ul>
    <li><i>Estoy comiendo.</i> (Ich esse gerade.)</li>
    <li><i>Están hablando por teléfono.</i> (Sie telefonieren gerade.)</li>
  </ul>
  <div class="warn"><b>Unregelmäßig:</b> <i>leer → leyendo</i>, <i>decir → diciendo</i>, <i>ir → yendo</i>. Die Gerundio-Form von <i>dormir</i> ist <i>durmiendo</i>.</div>
  <h3>Dauer: hace und desde</h3>
  <p>Wenn etwas seit einer Zeit andauert, verwendet man:</p>
  <ul>
    <li><b>Vivo aquí desde hace tres años.</b> (Ich wohne seit drei Jahren hier.) – Präsens bei noch laufender Handlung.</li>
    <li><b>Hace tres años que vivo aquí.</b> (Dasselbe, andere Reihenfolge.)</li>
  </ul>
  <h3>Zukunft: ir a + Infinitiv</h3>
  <p>Für geplante Zukunft nutzt du das Präsens von <i>ir</i> plus <i>a</i> und dem Infinitiv: <i>Mañana voy a viajar a Barcelona.</i> (Morgen fahre ich nach Barcelona.) Das ist im Alltag die häufigste Zukunftsform.</p>`,
  examples:['Estoy comiendo.','Vivo aquí desde hace tres años.','Mañana voy a viajar.','Están hablando por teléfono.'],
  ex:[
    {t:'fill', q:'Estoy ___ (comer). (gerade essen)', a:'comiendo'},
    {t:'mc', q:'Vivo aquí ___ tres años.', o:['desde hace','hace','desde','para'], a:0},
    {t:'mc', q:'Mañana ___ a Barcelona.', o:['voy a viajar','voy viajar','vamos viajar','voy viajo'], a:0},
    {t:'fill', q:'Ahora mismo ___ (leer, nosotros). (wir lesen gerade)', a:'estamos leyendo'}
  ]
},
{
  id:'a2-9', title:'A2 · 18. Imperativ & Präpositionen', goal:'Bitten, Anweisungen geben und „für mich / mit dir“ sagen',
  rule:`
  <h3>Imperativ bei tú (bejahend)</h3>
  <p>Für die Du-Form wird im bejahenden Imperativ die Form der 3. Person Singular genommen:</p>
  <table>
    <tr><th>Infinitiv</th><th>Imperativ (tú)</th><th>Beispiel</th></tr>
    <tr><td>hablar</td><td>habla</td><td>¡Habla más despacio!</td></tr>
    <tr><td>comer</td><td>come</td><td>¡Come algo!</td></tr>
    <tr><td>escribir</td><td>escribe</td><td>¡Escribe un mensaje!</td></tr>
  </table>
  <h3>Unregelmäßige Imperative</h3>
  <p><i>venir → ven</i> (komm), <i>decir → di</i> (sag), <i>hacer → haz</i> (mach), <i>tener → ten</i> (hab), <i>ir → ve</i> (geh), <i>poner → pon</i> (stell/leg). Diese solltest du auswendig lernen.</p>
  <div class="warn"><b>Achtung:</b> Verneinte Befehle verwenden den Konjunktiv: <i>¡No hables tan rápido!</i> (Sprich nicht so schnell!) Der Imperativ ist hier kein Thema für A2, aber du wirst ihn hören.</div>

  <h3>Präpositionen mit Personen</h3>
  <ul>
    <li><b>para mí</b> (für mich), <b>para ti</b> (für dich): <i>Este regalo es para ti.</i></li>
    <li><b>conmigo</b> (mit mir), <b>contigo</b> (mit dir): <i>¿Vienes conmigo?</i> (Kommst du mit mir?)</li>

  <div class="step"><b>Merke:</b> Nach <i>con</i> entsteht eine Sonderform: <i>con + mí = conmigo</i>, <i>con + ti = contigo</i>. Nur bei diesen beiden Personen.</div>`,

const A1 = [...A1_GRAMMAR, ARTIKEL_TRAINING, ...VERB_LESSONS.filter(v=>v.id.startsWith('vb1'))];

/* =====================================================================

const nav = document.getElementById('nav');
const main = document.getElementById('main');

function labelOf(L){ return L.title.startsWith('A') ? L.title : 'A1 · ' + L.title; }

function buildNav(active){
  nav.innerHTML = `<div class="card">
      <button class="nav-btn ${active==='home'?'active':''}" data-go="home"><span>🏠 Start & Heute</span></button>
      <button class="nav-btn ${active==='exam'?'active':''}" data-go="exam"><span>📝 Prüfungs-Simulation</span></button>
    </div>` +
  LESSONS.map((L,i)=>{
    const d = progress.done[L.id];
    return `<button class="nav-btn ${active===i?'active':''}" data-go="${i}"><span>${labelOf(L)}</span>${d!==undefined?`<span class="badge">${d}%</span>`:''}</button>`;
  }).join('');
}

function renderEx(list, host, onFinish){
  host.innerHTML = '';
  let score = 0, n = 0;
  list.forEach((e,i)=>{
    const d = document.createElement('div');
    d.className = 'ex';
    d.innerHTML = `<p><b>${i+1}.</b> ${e.q}</p>` + (e.t==='mc'
      ? `<div class="opts">${e.o.map((o,j)=>`<button data-j="${j}">${o}</button>`).join('')}</div>`
      : `<input type="text" autocomplete="off" placeholder="Antwort auf Spanisch"> <button class="primary chk">Prüfen</button>`)
      + `<div class="fb"></div>`;
    host.appendChild(d);
    const fb = d.querySelector('.fb');
    const finish = (ok, txt)=>{
      if(d.dataset.done) return;
      d.dataset.done = 1; n++; if(ok) score++;
      fb.className = 'fb ' + (ok?'ok':'bad');
      fb.textContent = (ok ? '✔ Richtig! ' : '✘ Leider falsch. ') + txt;
      if(n === list.length) onFinish(score, list.length);
    };
    if(e.t === 'mc'){
      d.querySelectorAll('.opts button').forEach(b=>b.onclick = ()=>{
        if(d.dataset.done) return;
        const j = +b.dataset.j;
        d.querySelectorAll('.opts button').forEach(x=>x.disabled = true);
        b.classList.add('sel');
        finish(j === e.a, e.h || ('Richtige Antwort: ' + e.o[e.a]));
      });
    } else {
      const inp = d.querySelector('input');
      const go = ()=>{
        if(!inp.value.trim() || d.dataset.done) return;
        const v = norm(inp.value);
        const ok = v === norm(e.a) || (e.alt||[]).some(x=>norm(x)===v);
        inp.disabled = true;
        finish(ok, e.h || ('Richtige Antwort: ' + e.a));
      };
      d.querySelector('.chk').onclick = go;
      inp.onkeydown = ev => { if(ev.key === 'Enter') go(); };
    }
  });
}

function showHome(){
  buildNav('home');
  const doneCount = Object.keys(progress.done).length;
  const avg = doneCount ? Math.round(Object.values(progress.done).reduce((a,b)=>a+b,0)/doneCount) : 0;
  const todayIdx = Math.floor(Date.now()/86400000) % LESSONS.length;
  const day = dayOffset() + 1;
  const vocCount = LESSONS.filter(L=>L.type==='vocab').reduce((s,L)=>s+visible(L.pool).length,0);

  main.innerHTML = `
    <div class="card">
      <h2>¡Hola! Willkommen in deinem Kurs</h2>
      <p>Ich bin dein Lehrer. Wir gehen Schritt für Schritt vor: erst die Regel verstehen, dann mit Beispielen üben, dann selbst sprechen. Du musst nicht alles an einem Tag schaffen. Regelmäßigkeit bringt dich weiter als lange Einzelsitzungen.</p>
      <div class="stats">
        <div class="stat">Kurstag<br><b>${day}</b></div>
        <div class="stat">Lektionen begonnen<br><b>${doneCount}/${LESSONS.length}</b></div>
        <div class="stat">Ø Ergebnis<br><b>${avg}%</b></div>
        <div class="stat">Vokabeln freigeschaltet<br><b>${vocCount}</b></div>
        <div class="stat">Verben freigeschaltet<br><b>${verbCount}</b></div>
      </div>
      <p class="muted">Jeden Tag werden automatisch neue Vokabeln und Verben freigeschaltet. Je länger du dabei bist, desto mehr siehst du.</p>
    </div>
    <div class="card">
      <h3>Lektion für heute</h3>
      <p>${labelOf(LESSONS[todayIdx])}: ${LESSONS[todayIdx].goal}</p>
      <button class="primary" data-go="${todayIdx}">Heutige Lektion starten</button>
    </div>
    <div class="card">
      <h3>Prüfungs-Simulation</h3>
      <p>20 gemischte Aufgaben aus allen Lektionen. Ideal, um deinen Stand zu prüfen.</p>
      <button class="secondary" data-go="exam">Simulation starten</button>
    </div>`;
}

function showLesson(i){
  buildNav(i);
  const L = LESSONS[i];
  let rule = L.rule || '';
  let examples = L.examples || [];
  let note = L.note || '';
  let ex = getEx(L);

  if(L.type === 'vocab'){
    const items = visible(L.pool);
    rule = `<table>${items.map(([es,de])=>`<tr><td>${es}</td><td>${de}</td><td><button class="sound" data-say="${es}">🔊</button></td></tr>`).join('')}</table>`;
    examples = items.slice(0,3).map(v=>v[0]);
    note = `${items.length} von ${L.pool.length} Vokabeln freigeschaltet. Jeden Tag kommen neue dazu.`;
  }
  if(L.type === 'verb'){
    const items = visible(L.pool, 4);
    const head = L.mode === 'pres'
      ? '<tr><th>Verb</th><th>yo</th><th>tú</th><th>él / ella</th><th>nosotros</th><th>ellos</th></tr>'
      : '<tr><th>Verb</th><th>yo</th><th>tú</th><th>él / ella</th><th>nosotros</th><th>ellos</th></tr>';
    rule = `<p class="rule">${L.mode==='pres'
      ? '<b>Merke:</b> Im Präsens steht die Verbendung für die Person. Lerne jede Reihe laut, dann jede Spalte.'
      : '<b>Merke:</b> Im Indefinido (abgeschlossene Vergangenheit) steht die Form für die Person. Achte besonders auf den Akzent bei yo und él/ella.'}</p>
      <table>${head}${items.map(v=>`<tr><td><b>${v.inf}</b> (${v.de})</td>${v.f.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
    note = `${items.length} von ${L.pool.length} Verben freigeschaltet. ${L.note}`;
    examples = [];
  }

  main.innerHTML = `
    <div class="card">
      <h2>${labelOf(L)}</h2>
      <p class="muted">${L.goal}</p>
      ${rule}
      ${examples.length ? `<h3>Beispiele zum Anhören & Nachsprechen</h3>${examples.map(s=>`<p>${s}<button class="sound" data-say="${s}">🔊</button></p>`).join('')}` : ''}
      ${note ? `<p class="muted">${note}</p>` : ''}
    </div>
    <div class="card">
      <h3>Übungen</h3>
      <div id="exh"></div>
    </div>`;
  renderEx(ex, document.getElementById('exh'), (s,t)=>{
    const pct = Math.round(s/t*100);
    progress.done[L.id] = Math.max(progress.done[L.id] || 0, pct);
    save();
    buildNav(i);
    document.getElementById('exh').insertAdjacentHTML('beforeend',
      `<p><b>Ergebnis: ${s}/${t} (${pct}%)</b> ${pct===100?'🎉 Perfekt!':'Wiederhole die Lektion, dann versuchen wir es noch einmal.'}</p>`);
  });
}

function showExam(){
  buildNav('exam');
  const all = LESSONS.flatMap(L=>getEx(L));
  const picked = all.sort(()=>Math.random()-0.5).slice(0,20);
  main.innerHTML = `<div class="card"><h2>Prüfungs-Simulation</h2>
    <p class="muted">20 zufällige Aufgaben aus allen Lektionen.</p><div id="exh"></div></div>`;
  renderEx(picked, document.getElementById('exh'), (s,t)=>{
    const pct = Math.round(s/t*100);
    document.getElementById('exh').insertAdjacentHTML('beforeend',
      `<p><b>Gesamtergebnis: ${s}/${t} (${pct}%)</b><br>
       ${pct>=80?'Sehr gut! Dein Grammatik-Grundgerüst sitzt.':pct>=60?'Gut, aber einige Bereiche brauchen noch Übung.':'Wir wiederholen die Lektionen mit den meisten Fehlern.'}</p>
       <button class="secondary" data-go="exam">Neue Simulation</button>`);
  });
}

/* ---------- EVENTS ---------- */
document.body.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){
    const g = go.dataset.go;
    if(g==='home') showHome();
    else if(g==='exam') showExam();
    else showLesson(+g);
    window.scrollTo(0,0);
  }
  const s = e.target.closest('[data-say]');
  if(s) say(s.dataset.say);
});

/* Zusätzliche, täglich automatisch erzeugte Einträge aus data/extra.json */
fetch('data/extra.json', {cache:'no-store'})
  .then(r => r.ok ? r.json() : {})
  .then(extra => {
    (extra.verbs || []).forEach(v => {
      const id = (v.level === 'A2' ? 'vb2-' : 'vb1-') + (v.type === 'irregular' ? 'irr' : 'reg');
      const L = LESSONS.find(x => x.id === id);
      if (L && !L.pool.some(p => p.inf === v.inf)) L.pool.push({inf: v.inf, de: v.de, f: v.f});
    });
    (extra.vocab || []).forEach(w => {
      const L = LESSONS.find(x => x.id === w.lesson);
      if (L && L.pool && !L.pool.some(p => p[0] === w.es)) L.pool.push([w.es, w.de]);
    });
    // Startseite nur neu zeichnen, wenn der Nutzer gerade noch dort ist
    if (!document.getElementById('exh')) showHome();
  })
  .catch(() => {});

showHome();
